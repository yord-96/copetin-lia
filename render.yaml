services:
  - type: web
    name: copetin-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JSON_LIMIT
        value: 25mb
      - key: DB_POOL_MAX
        value: 5
      - key: APP_STATE_ID
        value: copetin-main

  - type: web
    name: copetin-web
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
